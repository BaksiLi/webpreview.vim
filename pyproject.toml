[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "webpreview"
version = "0.2.1"
description = "Live Markdown and LaTeX preview for Vim, in your browser"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]

[project.urls]
Repository = "https://github.com/BaksiLi/webpreview.vim"
Issues = "https://github.com/BaksiLi/webpreview.vim/issues"

[project.scripts]
webpreview = "webpreview.reader:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
webpreview = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["webpreview"]
namespaces = false
